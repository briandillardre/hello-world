# Deploy config when this folder is published as its own Netlify site.
# In Netlify: set "Base directory" to dillard-construction-site (if deploying from the monorepo)
# or drag-and-drop this folder. No build step — pure static.

[build]
  publish = "."

# Clean URLs: /about resolves to about.html
[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200
[[redirects]]
  from = "/asphalt-paving"
  to = "/asphalt-paving.html"
  status = 200
[[redirects]]
  from = "/sitework-grading"
  to = "/sitework-grading.html"
  status = 200
[[redirects]]
  from = "/stormwater-utilities"
  to = "/stormwater-utilities.html"
  status = 200
[[redirects]]
  from = "/projects"
  to = "/projects.html"
  status = 200
[[redirects]]
  from = "/photos"
  to = "/projects.html"
  status = 301
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
[[redirects]]
  from = "/safety"
  to = "/safety.html"
  status = 200
[[redirects]]
  from = "/careers"
  to = "/careers.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
[[redirects]]
  from = "/request-an-estimate"
  to = "/contact.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
