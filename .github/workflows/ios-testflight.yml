# iOS build + TestFlight upload — runs on GitHub's macOS machines, so no Mac
# is ever needed on our side (owner has no Mac, Aug 7).
#
# Arms the day Apple approves Brian's INDIVIDUAL enrollment (the LLC's
# organization enrollment was denied as final on Sep 4 — board #41). Add four
# repo secrets (Settings → Secrets → Actions). The first three come from
# App Store Connect → Users and Access → Integrations → App Store Connect API
# → create a TEAM key with the Admin role (Developer cannot mint signing
# certificates); the Team ID is on developer.apple.com → Membership details.
#   ASC_KEY_ID       App Store Connect API key ID (10 characters)
#   ASC_ISSUER_ID    issuer ID (the UUID on the same page)
#   ASC_KEY_P8       the whole AuthKey_XXXXXXXXXX.p8 file, BEGIN/END lines included
#   ASC_TEAM_ID      Apple Team ID (10 characters)
# fastlane registers the app if needed, gets a distribution certificate + App
# Store profile through the API key, builds the Capacitor shell, and pushes
# to TestFlight. Optional, before the THIRD build: MATCH_GIT_URL +
# MATCH_GIT_BASIC_AUTHORIZATION + MATCH_PASSWORD keep one certificate in a
# private repo instead of minting a new one per run (Apple caps live
# distribution certificates). Runbook: docs/APP-STORE-PLAYBOOK.md → "Approval day".
name: ios-testflight

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 1.4.1); blank = the one in the Xcode project'
        type: string
        default: ''

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
    steps:
      - name: Guard — App Store Connect secrets present?
        run: |
          missing=""
          if [ -z "${{ secrets.ASC_KEY_ID }}" ]; then missing="$missing ASC_KEY_ID"; fi
          if [ -z "${{ secrets.ASC_ISSUER_ID }}" ]; then missing="$missing ASC_ISSUER_ID"; fi
          if [ -z "${{ secrets.ASC_KEY_P8 }}" ]; then missing="$missing ASC_KEY_P8"; fi
          if [ -z "${{ secrets.ASC_TEAM_ID }}" ]; then missing="$missing ASC_TEAM_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing — this workflow arms after Apple Developer enrollment (docs/APP-STORE-PLAYBOOK.md → Approval day)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # Regenerates ios/App/CapApp-SPM/Package.swift from the installed plugins
      # (push, status bar, background geolocation, BLE) and copies the shell.
      - run: npx cap sync ios

      - name: Build + upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_VERSION: ${{ inputs.version }}
        run: cd ios/App && fastlane beta

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hammertrack-ios
          path: |
            ios/App/*.ipa
            ios/App/*.dSYM.zip
          if-no-files-found: ignore
          retention-days: 90
