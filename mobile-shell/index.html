<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HammerTrack</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      background: radial-gradient(120% 120% at 50% 0%, #12233a 0%, #0a1420 60%);
      color: #e8f0f7;
      font: 15px/1.6 system-ui, -apple-system, sans-serif;
      text-align: center; padding: max(24px, env(safe-area-inset-top)) 24px 24px;
    }
    .card { max-width: 320px; }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 18px;
      background: #ff9e16; display: grid; place-items: center; font-size: 34px;
      box-shadow: 0 8px 30px rgba(255,158,22,0.25);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.94); opacity: 0.82; } }
    @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
    h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: 0.02em; font-weight: 800; }
    p { color: #9fb6cc; margin: 0 0 22px; }
    button {
      background: #ff9e16; color: #1a1100; border: 0; border-radius: 12px;
      font-weight: 700; font-size: 15px; padding: 12px 28px;
    }
    button:active { transform: translateY(1px); }
    .hint { color: #64809b; font-size: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <!-- Shown when the live app can't load (server.errorPath): no signal, or the
       site not answering. Clock-ins, inspections and photos taken offline wait
       on the phone and send themselves once the app is back. -->
  <div class="card">
    <div class="mark">🔨</div>
    <h1 id="t">Can't reach HammerTrack</h1>
    <p id="m">Your trackers keep recording — the map catches up the moment you're back.</p>
    <button onclick="go()">Try again</button>
    <p class="hint" id="h">Reconnecting automatically…</p>
  </div>
  <script>
    function say() {
      var off = navigator.onLine === false;
      document.getElementById('t').textContent = off ? 'No signal' : "Can't reach HammerTrack";
      document.getElementById('h').textContent = off ? 'Reconnecting as soon as there is signal…' : 'Trying again by itself…';
    }
    say();
    window.addEventListener('offline', say);
    function go() { location.href = 'https://hammertrack.ai/map'; }
    // Back the instant the phone is online again.
    window.addEventListener('online', go);
    // And keep trying: a missed online event, or the site coming back. Each
    // failed try lands back here, so the wait doubles across them (5 s → 60 s,
    // remembered for 10 minutes) — a long outage isn't a reload every 5 s.
    var st = {}, now = Date.now();
    try { st = JSON.parse(sessionStorage.getItem('ht_fail') || '{}'); } catch (e) {}
    var n = st.at && now - st.at < 600000 ? (st.n || 0) + 1 : 1;
    try { sessionStorage.setItem('ht_fail', JSON.stringify({ n: n, at: now })); } catch (e) {}
    var wait = Math.min(60000, 5000 * Math.pow(2, n - 1));
    (function tick() { setTimeout(function () { if (navigator.onLine !== false) go(); else tick(); }, wait); })();
  </script>
</body>
</html>
